# Gera os instaladores do Windows: roda os testes, empacota o AgendaLicitacoes.exe (servidor)
# e o AgendaUsuario.exe (usuários) com o PyInstaller, monta os instaladores (Inno Setup) e os
# testa em instalações silenciosas. Eles ficam em Actions > (execução) > Artifacts; ao criar
# uma tag vX.Y.Z, também são publicados na página de versões (Releases) do repositório.
name: Instalador do Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testes
        run: python -m pytest -q

      - name: Versão
        id: versao
        run: |
          $v = (python -c "import licitacoes; print(licitacoes.__version__)").Trim()
          "versao=$v" >> $env:GITHUB_OUTPUT

      - name: Empacotar o AgendaLicitacoes.exe e o AgendaUsuario.exe
        run: |
          python instalador/gerar_icone.py
          pyinstaller --noconfirm --distpath dist --workpath build instalador/agenda.spec
          pyinstaller --noconfirm --distpath dist --workpath build instalador/usuario.spec

      - name: Testar o executável
        run: |
          $dados = Join-Path $env:RUNNER_TEMP "dados"
          dist\AgendaLicitacoes\AgendaLicitacoes.exe --versao
          dist\AgendaLicitacoes\AgendaLicitacoes.exe --preparar --dados $dados
          if (-not (Test-Path "$dados\licitacoes.sqlite3")) { throw "Banco não foi criado" }

      - name: Montar os instaladores (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          foreach ($script in "AgendaUsuario.iss", "AgendaLicitacoes.iss") {
            & $iscc "/DVersao=${{ steps.versao.outputs.versao }}" "instalador\$script"
            if ($LASTEXITCODE -ne 0) { throw "ISCC falhou em $script ($LASTEXITCODE)" }
          }

      - name: Testar instalação e desinstalação silenciosas
        run: |
          $setup = (Get-ChildItem dist\AgendaLicitacoes-Servidor-*.exe | Select-Object -First 1).FullName
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", `
            "/TASKS=iniciar,compartilhar,firewall,nuvem", "/NUVEM=C:\NuvemTeste\AgendaLicitacoes", `
            "/LOG=$env:RUNNER_TEMP\instalacao.log"
          Get-Content "$env:ProgramData\AgendaLicitacoes\instalacao.log"
          $ok = $false
          foreach ($i in 1..30) {
            try { if ((Invoke-WebRequest http://localhost:8080/ -UseBasicParsing).Content -match "Criar administrador") { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Get-Content "$env:ProgramData\AgendaLicitacoes\servidor.log" -ErrorAction SilentlyContinue; throw "O sistema não respondeu em http://localhost:8080" }
          if (-not (Get-SmbShare -Name Licitacoes -ErrorAction SilentlyContinue)) { throw "Pasta não foi compartilhada" }
          if (-not (Get-NetFirewallRule -DisplayName "Agenda de Licitacoes" -ErrorAction SilentlyContinue)) { throw "Regra do firewall não foi criada" }
          if (-not (Test-Path "C:\AgendaLicitacoes\Abrir Agenda de Licitações.url")) { throw "Atalho dos usuários não foi criado" }
          # Primeiro acesso: administrador e senha de recuperação; as cópias cifradas começam.
          $url = "http://localhost:8080/configuracao-inicial"
          $pagina = Invoke-WebRequest $url -UseBasicParsing -SessionVariable sessao
          $token = [regex]::Match($pagina.Content, 'name="_csrf" value="([^"]+)"').Groups[1].Value
          $corpo = @{ _csrf = $token; nome = "Teste"; login = "teste"; senha = "Kq8#mZ2!rio"; confirmacao = "Kq8#mZ2!rio"
                      recuperacao = "Cofre#Agenda-77"; recuperacao_confirmacao = "Cofre#Agenda-77" }
          $resposta = Invoke-WebRequest $url -Method Post -Body $corpo -WebSession $sessao -UseBasicParsing
          if ($resposta.Content -notmatch "Administrador criado") { throw "Configuração inicial falhou" }
          foreach ($arquivo in "licitacoes.cifrado", "chave.json", "anfitriao.json", "copia.json") {
            if (-not (Test-Path "C:\NuvemTeste\AgendaLicitacoes\$arquivo")) { throw "Cópia na nuvem sem $arquivo" }
          }
          if (-not (Get-NetFirewallRule -DisplayName "Agenda de Licitacoes (descoberta)" -ErrorAction SilentlyContinue)) { throw "Regra da descoberta não foi criada" }
          Write-Output "Instalação OK: sistema respondendo, pasta compartilhada, firewall, atalho e cópia na nuvem."

          # Programa dos usuários, instalado a partir da pasta compartilhada do servidor.
          $usuarios = Get-ChildItem "C:\AgendaLicitacoes\Instalar Agenda de Licitações (usuários).exe"
          Start-Process $usuarios.FullName -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $programa = "$env:LOCALAPPDATA\Programs\AgendaLicitacoes\AgendaUsuario.exe"
          if (-not (Test-Path $programa)) { throw "Programa dos usuários não foi instalado" }
          $icone = Join-Path ([Environment]::GetFolderPath("Desktop")) "Agenda de Licitações.lnk"
          if (-not (Test-Path $icone)) { throw "Ícone dos usuários não foi criado" }
          $config = Get-Content "$env:LOCALAPPDATA\AgendaLicitacoes\usuario.json" -Raw | ConvertFrom-Json
          if ($config.pasta_servidor -ne "C:\AgendaLicitacoes") { throw "Pasta do servidor não foi guardada: $($config.pasta_servidor)" }
          $saida = "$env:RUNNER_TEMP\endereco.txt"
          $p = Start-Process $programa -Wait -PassThru -ArgumentList "--descobrir", "`"$saida`""
          $achado = Get-Content $saida -Raw
          if ($p.ExitCode -ne 0 -or $achado -notmatch ":8080/") { throw "Programa dos usuários não achou o servidor ($achado)" }
          Write-Output "Programa dos usuários OK: instalado sem administrador e achou o servidor em $achado"

          Start-Process "C:\AgendaLicitacoes\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          Start-Sleep -Seconds 5
          if (Get-ScheduledTask -TaskName "Agenda de Licitacoes" -ErrorAction SilentlyContinue) { throw "Tarefa não foi removida" }
          if (Get-SmbShare -Name Licitacoes -ErrorAction SilentlyContinue) { throw "Compartilhamento não foi removido" }
          if (-not (Test-Path "$env:ProgramData\AgendaLicitacoes\licitacoes.sqlite3")) { throw "Os dados deveriam ser mantidos" }
          Write-Output "Desinstalação OK: configuração removida e dados mantidos."

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaLicitacoes-Instaladores-${{ steps.versao.outputs.versao }}
          path: |
            dist/AgendaLicitacoes-Servidor-*.exe
            dist/AgendaLicitacoes-Usuario-*.exe

      - name: Publicar na página de versões
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AgendaLicitacoes-Servidor-*.exe
            dist/AgendaLicitacoes-Usuario-*.exe
